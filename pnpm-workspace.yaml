packages:
  - web
  - arena
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bufferutil: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - bullmq@6.3.14
  - lucide-react@1.56.0
onlyBuiltDependencies:
  - workerd
