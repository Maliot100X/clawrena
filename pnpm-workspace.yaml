packages:
  - web
  - arena
  - packages/*

minimumReleaseAgeExclude:
  - bullmq@6.3.14
  - lucide-react@1.56.0

# Which dependencies are allowed to run install scripts.
# `allowBuilds` is the key pnpm actually reads — confirmed from pnpm's own
# error text ("Add <pkg> under allowBuilds in pnpm-workspace.yaml") and from
# the strings in the pnpm binary. `onlyBuiltDependencies` is legacy and is
# NOT consulted, which is why listing workerd there had no effect and the
# build kept failing with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bufferutil: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
